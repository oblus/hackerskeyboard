plugins {
    id 'com.android.application'
}

android {
    namespace = 'org.n0pocketworkstation.pckeyboard'
    //noinspection GradleDependency
    compileSdk = 35
    ndkVersion = "28.2.13676358"



    defaultConfig {
        applicationId = "org.n0pocketworkstation.pckeyboard"
        minSdk = 23
        //noinspection OldTargetApi
        targetSdk = 34
        //noinspection TargetApi

        versionCode = 1041004
        versionName = "1.41.1-4"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path = "CMakeLists.txt"
        }
    }

    buildFeatures {
        buildConfig = true
    }   //noinspection debug option - to remove 16.04.2026 22:21 //
    tasks.withType(JavaCompile).configureEach {options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"}
}

tasks.register('copyReadme', Copy) {
    from "../README.md"
    into "src/main/assets"
}

project.afterEvaluate {
    if (tasks.findByName("generateDebugAssets")) {
        tasks.named("generateDebugAssets").configure { dependsOn copyReadme }
    }
    if (tasks.findByName("generateReleaseAssets")) {
        tasks.named("generateReleaseAssets").configure { dependsOn copyReadme }
    }
}

dependencies {
    implementation libs.kotlin.stdlib
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.androidx.preference


    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}