plugins {
    id 'com.android.application'
}

android {
    namespace 'org.n0pocketworkstation.pckeyboard'
    compileSdk 36
    ndkVersion "28.2.13676358"



    defaultConfig {
        applicationId "org.n0pocketworkstation.pckeyboard"
        minSdk 23
        //noinspection OldTargetApi
        targetSdk 34
        //noinspection TargetApi

        versionCode 1041003
        versionName "1.41.1-3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    buildFeatures {
        buildConfig true
    }    // debug option - to remove  13.04.2026 20:25  //tasks.withType(JavaCompile).configureEach {options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"}
 }

dependencies {
    implementation libs.kotlin.stdlib
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.androidx.preference


    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}